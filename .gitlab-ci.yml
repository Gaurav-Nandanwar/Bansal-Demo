stages:
  - build

variables:
  ANDROID_HOME: /opt/android-sdk
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  NODE_MODULES_CACHE: $CI_PROJECT_DIR/node_modules

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - android/.gradle/
    - .gradle/
    - android/app/build/
    - $GRADLE_USER_HOME
    - ~/.gradle
  policy: push

build_release_apk:
  stage: build
  tags:
    - rahul-macbook
  image: reactnativecommunity/react-native-android:latest
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - npm ci  # Faster and more deterministic than `npm install`
    - cd android
    - if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 7.5; fi
    - chmod +x ./gradlew
    - export PATH=$ANDROID_HOME/platform-tools:$PATH
  script:
    - ./gradlew --no-daemon --parallel assembleRelease
    - mkdir -p ../artifacts
    - cp app/build/outputs/apk/release/*.apk ../artifacts/release.apk
  artifacts:
    when: on_success
    paths:
      - artifacts/release.apk
    expire_in: 1 week
  only:
    - main
